name: Android APK

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: write   # to update the "apk-latest" release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # A fixed signing key lets each new APK install over the previous one.
      # Without it, every build gets a random key and you'd have to uninstall first.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            mkdir -p ~/.android && echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
          else
            echo "::warning::ANDROID_DEBUG_KEYSTORE_B64 not set - APK signed with a throwaway key"
          fi

      - name: Build APK
        working-directory: android
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          [ -n "$SUPABASE_ANON_KEY" ] || echo "::warning::SUPABASE_ANON_KEY not set - the app will build but cannot sign in"
          gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../expense-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: expense-tracker-apk
          path: expense-tracker.apk

      - name: Publish to "apk-latest" release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest expense-tracker.apk --title "Latest APK (build ${{ github.run_number }})" \
            --notes "Built from ${{ github.sha }}. Install on your phone; it updates over the previous build." --prerelease
